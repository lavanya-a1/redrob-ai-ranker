# ============================================================================
# Compute environment
# ============================================================================
compute:
  platform: "Local Windows/Linux Box"           # Your standard developer workstation profile
  cpu_cores: 8                                  # Multi-core processor profile
  ram_gb: 16                                    # Fixed RAM execution footprint
  python_version: "3.10.11"                     # Pinned core Python environment version
  os: "Windows 11"                              # Local operating system footprint
  uses_gpu_for_inference: false                 # Must be false — matching compute constraints
  has_network_during_ranking: false             # Must be false — local standalone execution
  pre_computation_required: true                # Set to true because you compile FAISS indices offline
  pre_computation_time_minutes: 2               # Extremely fast offline initialization cycle

# ============================================================================
# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Gemini"        # Primary system engineering 
  - "ChatGPT"       # documentation collaborator
ai_usage_summary: |  
  Used Gemini for technical pipeline design, architectural validation strategy, and code review. 
  Used Gemini to refine the validation testing suite rules and structure documentation templates. 
  Absolutely no sensitive candidate profile data or ground-truth dataset inputs were transmitted to any external LLM hub.

# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  Two-stage evaluation engine separating semantic text mining from strict algebraic heuristic scoring. 
  The pipeline utilizes a lightweight dense vector mapping framework powered by an inner-product FAISS matrix (IndexFlatIP) 
  for high-velocity candidate pool retrieval. Retrieved records are instantly parsed through a multi-variable re-ranking 
  algorithm applying a rigorous 50/15/15/10/10 weighted formula across semantic similarity, explicit technical skill matching, 
  behavioral alignment, structural experience depth, and specific target profile attributes. Includes built-in structural 
  sanity honeypot rules to trap timeline fraud and skill inflation. Accompanied by a validation suite that monitors output type 
  safety, schema structures, and deterministic monotonic scoring degradation prior to disk commitment.

